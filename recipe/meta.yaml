{% set version = "6.0.1" %}

package:
  name: pytest-runner
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/p/pytest-runner/pytest-runner-{{ version }}.tar.gz
  sha256: 70d4739585a7008f37bf4933c013fdb327b8878a5a69fcbb3316c88882f0f49b

build:
  number: 0
  skip: true  # [py<37]
  script: {{ PYTHON }} -m pip install . --no-deps --ignore-installed --no-cache-dir -vvv

requirements:
  host:
    - python
    - pip
    - setuptools_scm >=3.4.1
    - setuptools >=56
    - toml
    - setuptools-scm >=3.4.1
  run:
    - python
    - setuptools >=56
    - pytest

test:
  imports:
    - ptr
  requires:
    - pip
  commands:
    - pip check

about:
  home: https://github.com/pytest-dev/pytest-runner
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Invoke py.test as distutils command with dependency resolution.
  dev_url: https://github.com/pytest-dev/pytest-runner
  doc_url: https://github.com/pytest-dev/pytest-runner

extra:
  recipe-maintainers:
    - dopplershift
    - ocefpaf